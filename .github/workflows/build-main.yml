name: Build & Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build and test
        run: ./gradlew clean check
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test-results/**/*.xml
            build/reports/**

  e2e:
    name: E2E (Spring / Helidon / Java demos)
    runs-on: ubuntu-latest
    # Docker is preinstalled on ubuntu-latest runners.
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify docker & docker compose are available
        run: |
          docker --version
          docker compose version

      - name: Run E2E tests
        run: ./gradlew :e2e:test -PrunE2E

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose -f demo/local/docker-compose.yml logs --no-color || true

      - name: Tear down docker compose (safety net)
        if: always()
        run: docker compose -f demo/local/docker-compose.yml down -v || true

      - name: Upload e2e test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            e2e/build/test-results/**/*.xml
            e2e/build/reports/**
