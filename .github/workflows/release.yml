# Publishes a release to GitHub Packages and Maven Central using JReleaser.
#
# HOW TO TRIGGER A RELEASE
# -------------------------
# 1. Update `otto_config_version` in build.gradle to a non-SNAPSHOT version.
# 2. Update CHANGELOG.md with a "## <version>" entry.
# 3. Commit and push:
#      git commit -am "chore: prepare release 0.2.0"
#      git push
# 4. Trigger this workflow, specifying the version:
#      gh workflow run release.yml -f version=0.2.0
#    Or use the GitHub Actions UI: Actions → Release → Run workflow.
#
# After a successful release, bump build.gradle to the next SNAPSHOT version and commit.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match otto_config_version in build.gradle, without -SNAPSHOT)"
        required: true
        type: string

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to create GitHub releases and push the release tag
      packages: write   # needed to publish to GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # JReleaser needs full history to generate changelogs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate version matches build.gradle
        run: |
          DECLARED=$(grep 'def otto_config_version' build.gradle | grep -o '"[^"]*"' | tr -d '"')
          if [ "$DECLARED" != "${{ inputs.version }}" ]; then
            echo "ERROR: Input version '${{ inputs.version }}' does not match build.gradle version '$DECLARED'."
            echo "Update build.gradle first, commit, then re-run this workflow."
            exit 1
          fi
          if [[ "$DECLARED" == *-SNAPSHOT ]]; then
            echo "ERROR: build.gradle still contains a SNAPSHOT version: $DECLARED"
            echo "Remove the -SNAPSHOT suffix before releasing."
            exit 1
          fi
          echo "Version check passed: $DECLARED"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release notes from CHANGELOG.md and git history
        run: |
          mkdir -p build
          VERSION="${{ inputs.version }}"

          # 1. Extract the human-written section from CHANGELOG.md.
          #    Grabs everything between "## <version>" and the next "## " heading.
          awk "/^## ${VERSION}$/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' \
            > build/release-notes.md
          if [ ! -s build/release-notes.md ]; then
            echo "ERROR: No changelog entry found for version '${VERSION}' in CHANGELOG.md."
            echo "Add a '## ${VERSION}' section to CHANGELOG.md before releasing."
            exit 1
          fi

          # 2. Append the git commit log since the previous release tag.
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -v "^v\?${VERSION}$" \
            | head -1)
          if [ -n "$PREV_TAG" ]; then
            echo "" >> build/release-notes.md
            echo "## Commits since ${PREV_TAG}" >> build/release-notes.md
            git log "${PREV_TAG}..HEAD" \
              --pretty=format:"- %h %s" \
              --no-merges \
              >> build/release-notes.md
          fi

          echo "--- release-notes.md ---"
          cat build/release-notes.md

      - name: Validate JReleaser config
        run: ./gradlew jreleaserConfig
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}

      - name: Run tests
        run: ./gradlew check

      - name: Publish artifacts to staging
        run: ./gradlew publish
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}

      - name: Full release (GitHub + Maven Central)
        run: ./gradlew jreleaserFullRelease
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVENCENTRAL_PASSWORD }}

      # Go modules aren't published to Maven Central or GitHub Packages --
      # there is no such registry for Go. A Go module is "published" simply
      # by pushing a semver git tag, which consumers then fetch directly
      # from GitHub via `go get` (transparently mirrored by proxy.golang.org
      # / sum.golang.org). Because the Go module lives in the `go/`
      # subdirectory, Go's multi-module-repo convention requires the tag to
      # be prefixed with the subdirectory path, e.g. `go/v0.2.0` -- see
      # https://go.dev/ref/mod#vcs-version. We reuse the exact same version
      # number as the main Java release so both artifacts always move
      # together under one release process.
      - name: Tag Go module for this release
        run: |
          VERSION="${{ inputs.version }}"
          GO_TAG="go/v${VERSION}"
          git fetch --tags
          if git rev-parse "$GO_TAG" >/dev/null 2>&1; then
            echo "Tag $GO_TAG already exists, skipping."
          else
            git tag "$GO_TAG" "v${VERSION}"
            git push origin "$GO_TAG"
            echo "Pushed $GO_TAG -- consumers can now run: go get github.com/otto-de/otto-config/go@v${VERSION}"
          fi

      - name: Upload JReleaser output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-output
          path: |
            build/jreleaser/output.properties
            build/jreleaser/trace.log
