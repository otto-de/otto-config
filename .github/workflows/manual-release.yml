name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for GitHub release (leave empty to use version from build.gradle)'
        required: false
        type: string
      create_tag:
        description: 'Create a git tag for this release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Get version from build.gradle
        id: get_version
        run: |
          VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"
      
      - name: Display current version
        run: |
          echo "Current version in build.gradle:"
          grep "otto_config_version" build.gradle
      
      - name: Build and test
        run: ./gradlew clean check
      
      - name: Publish to local staging
        env:
          GPG_SIGNING_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        run: ./gradlew publish
      
      - name: Deploy to GitHub Packages
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        run: ./gradlew jreleaserDeploy --deployer-name=github --exclude-deployer-name=mavenCentral
      
      - name: Deploy to Maven Central
        env:
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
        run: ./gradlew jreleaserDeploy --deployer-name=mavenCentral --exclude-deployer-name=github
      
      - name: Create git tag
        if: ${{ inputs.create_tag }}
        run: |
          VERSION=${{ inputs.version || steps.get_version.outputs.VERSION }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a "v$VERSION" -m "Release $VERSION"
          git push -f origin "v$VERSION"
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ inputs.version || steps.get_version.outputs.VERSION }}
          tag_name: v${{ inputs.version || steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'SNAPSHOT') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/libs/*.jar
