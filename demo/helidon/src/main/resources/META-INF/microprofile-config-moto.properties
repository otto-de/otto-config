# 'moto' profile overrides — point the demo at demo/local/docker-compose.yml
# (moto + vault) instead of real AWS / corporate Vault.
#
# Activate with: -Dmp.config.profile=moto (see run task in build.gradle)
# The profile is intentionally NOT called 'local' because Otto Config treats
# the 'local' profile as a signal to bypass the AWS/Vault sources entirely
# and fall back to file-based configuration (see
# CoreSourceFactory#isLocalProfile).
#
# Prerequisite: `cd demo/local && docker compose up -d && source ./.env`

# SecretsManager: the SDK accepts a secret name for GetSecretValue, so we don't
# need the randomly-suffixed ARN moto generates.
otto.config.aws.secrets.arn=otto-config

# Vault: use the local dev instance and approle auth (override the AWS/STS auth
# from the default microprofile-config.properties, which requires the corporate
# Vault).
otto.config.hashicorp.vault.url=http://localhost:8200
otto.config.hashicorp.vault.auth.type=approle

# Push-based refresh via the queue provisioned by init-moto.sh. moto uses the
# default AWS account id 123456789012.
otto.config.aws.change.notifications.enabled=true
otto.config.aws.change.notifications.queue.url=http://localhost:5000/123456789012/otto-config-config-changes
