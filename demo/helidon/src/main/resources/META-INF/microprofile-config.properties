app.name=otto-config
server.port=8080
server.host=0.0.0.0

# Otto Config
otto.config.sources.enabled=aws.appconfig.properties,aws.appconfig.toggles,aws.secrets,aws.ssm
otto.config.aws.secrets.arn=arn:aws:secretsmanager:eu-central-1:537090272221:secret:zealot-kTDaEb
otto.config.aws.ssm.path.prefix=/search/develop/otto-config
otto.config.hashicorp.vault.url=https://main.live.vault.platform.otto.de
otto.config.hashicorp.vault.path=cftsearch/data/service/otto-config/develop/auth
otto.config.hashicorp.vault.prev.versions=3
otto.config.hashicorp.vault.auth.type=aws
otto.config.hashicorp.vault.auth.approle.role.id=${VAULT_ROLE_ID}
otto.config.hashicorp.vault.auth.approle.secret.id=${VAULT_SECRET_ID}
otto.config.hashicorp.vault.auth.aws.role.name=search
otto.config.hashicorp.vault.auth.aws.header.value=vault-prod.esb.ottogroup.com

# Push-based Configuration Refresh
# When enabled, Otto Config receives immediate notifications about configuration changes
# via EventBridge -> SQS, instead of relying solely on periodic polling.
# The queue and EventBridge rules are provisioned by the Terraform module when
# change_notification_enabled=true. Use the change_notification_queue_url output.
otto.config.aws.change.notifications.enabled=true
otto.config.aws.change.notifications.queue.url=https://sqs.eu-central-1.amazonaws.com/537090272221/otto-config-changes

# Logging
logging.level.de.otto.config=DEBUG

# Custom properties with placeholders
my.url=https://${myKey1}.otto.de
