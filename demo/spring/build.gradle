plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

apply from: 'gradle/integrationTest.gradle'

application {
    mainClass = 'de.otto.config.demo.DemoApplication'
}

dependencies {
    implementation project(':') 
    implementation "org.springframework.boot:spring-boot-starter:${springBootVersion}"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
}

// Ensure resources are processed before running
bootRun.dependsOn processResources
run.dependsOn processResources
test.dependsOn processResources

// VS Code uses bin/ directory (Eclipse-style) instead of build/ (Gradle-style)
// This task syncs resources so they're available when debugging from VS Code
tasks.register('syncResourcesToVSCode', Copy) {
    description = 'Copies processed resources from build/ to bin/ for VS Code compatibility'
    from layout.buildDirectory.dir('resources/main')
    into layout.projectDirectory.dir('bin/main')
    onlyIf { layout.projectDirectory.dir('bin').asFile.exists() }
}

tasks.register('syncTestResourcesToVSCode', Copy) {
    description = 'Copies processed test resources from build/ to bin/ for VS Code compatibility'
    from layout.buildDirectory.dir('resources/test')
    into layout.projectDirectory.dir('bin/test')
    onlyIf { layout.projectDirectory.dir('bin').asFile.exists() }
}

// Automatically sync resources after processing them
processResources.finalizedBy syncResourcesToVSCode
processTestResources.finalizedBy syncTestResourcesToVSCode
